function makeMeta(model,src){
  const now=new Date(),p2=n=>String(n).padStart(2,'0');
  const doy=Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-Date.UTC(now.getUTCFullYear(),0,0))/864e5);
  const h=hash(src+state.seed);
  const op=$('#opName').value.trim()||`${ADJ[h%ADJ.length]} ${NOUN[(h>>>8)%NOUN.length]}`;
  const ops=model.locations.filter(l=>!l.region);
  const loc=ops.find(l=>PLANET_TYPES.includes(l.type))||ops.find(l=>model.objectives.some(o=>o.locs.includes(l.id)))||ops[0];
  return {
    op:op.toUpperCase(),
    classif:$('#classif').value,
    from:$('#issuer').value.trim()||'Command',
    to:$('#recipient').value.trim()||'All hands',
    dtg:`${p2(now.getUTCDate())}${p2(now.getUTCHours())}${p2(now.getUTCMinutes())}Z ${MON[now.getUTCMonth()]} ${String(now.getUTCFullYear()).slice(2)}`,
    sd:`SD ${String(now.getUTCFullYear()).slice(2)}${String(doy).padStart(3,'0')}.${p2(now.getUTCHours())}`,
    ctl:`FIC-${String(now.getUTCFullYear()).slice(2)}-${String(h%9000+1000)}`,
    area:loc?loc.name:'',
    subject:loc?`${op.toUpperCase()} // ${loc.name.toUpperCase()}`:op.toUpperCase()
  };
}

/* entity highlighting: one pass over the raw text, escaping each piece */
function buildHl(model){
  const idx=makeIndex([...model.persons,...model.factions,...model.locations,...model.codex],false);
  return t=>{
    if(!idx.re) return esc(t);
    let out='',last=0;
    for(const m of t.matchAll(idx.re)){
      const info=idx.map.get(m[0].toLowerCase());
      if(!info||(info.cs&&m[0]!==info.orig)) continue;
      out+=esc(t.slice(last,m.index))+`<span class="ent ent-${info.e.t}" data-t="${info.e.t}" data-id="${info.e.id}">${esc(m[0])}</span>`;
      last=m.index+m[0].length;
    }
    return out+esc(t.slice(last));
  };
}
const byId=(m,id)=>m.persons.find(p=>p.id===id)||m.factions.find(f=>f.id===id)||m.locations.find(l=>l.id===id)||m.codex.find(x=>x.id===id)||null;
const ckey=e=>e.t+':'+e.name.toLowerCase();
const cardCls=e=>'card has-body'+(state.open.has(ckey(e))?' open':'');
const tgBtn=e=>`<button type="button" class="tg" aria-expanded="${state.open.has(ckey(e))}" aria-label="Expand or collapse ${esc(e.name)}" title="Expand or collapse"></button>`;
const allBar=()=>`<div class="allbar"><button type="button" class="btn ghost" data-all="open">Expand all</button><button type="button" class="btn ghost" data-all="close">Collapse all</button></div>`;
const chipBtn=e=>`<button type="button" class="${e.t}${['HOSTILE','WARY'].includes(e.status)?' bad':''}" data-t="${e.t}" data-id="${e.id}">${esc(e.name)}</button>`;
function linked(m,e,t,max){
  const out=[];
  for(const [id,n] of e.coIds){const o=byId(m,id);if(o&&o.t===t) out.push([o,n])}
  out.sort((a,b)=>b[1]-a[1]);
  return out.slice(0,max||8).map(x=>x[0]);
}
const linkBlock=(title,list)=>list.length?`<div><div class="lead" style="margin-top:0">${title}</div><div class="chips">${list.map(chipBtn).join('')}</div></div>`:'';

function blocksHtml(blocks,hl){
  return blocks.map(b=>b.type==='ul'?`<ul>${b.items.map(i=>`<li>${hl(i)}</li>`).join('')}</ul>`:`<p>${hl(b.text)}</p>`).join('');
}

function renderBrief(){
  const m=state.model,meta=state.meta;
  if(m.empty) return `<div class="empty"><b>No source text</b><p>Paste your session notes, a hook, or a scene description into the console and press Generate briefing.</p></div>`;
  const hl=buildHl(m);
  let n=0;const sec=(title,body)=>`<section class="sec"><h3><span class="n">${++n}</span>${title}</h3>${body}</section>`;
  const out=[];
  const prim=m.objectives.filter(o=>o.pri==='PRIMARY'),sec2=m.objectives.filter(o=>o.pri==='SECONDARY'),rest=m.objectives.filter(o=>o.pri==='RESTRICTION');

  let sit=blocksHtml(m.situation,hl);
  if(m.persons.length) sit+=`<div class="lead">Personnel of interest</div><div class="chips">${m.persons.map(chipBtn).join('')}</div>`;
  if(m.factions.length) sit+=`<div class="lead">Factions</div><div class="chips">${m.factions.map(chipBtn).join('')}</div>`;
  const places=m.locations.filter(l=>!l.region),regions=m.locations.filter(l=>l.region);
  if(m.locations.length) sit+=`<div class="lead">Area of operations</div><div class="chips">${[...places,...regions].map(chipBtn).join('')}</div>`;
  const terms=m.codex.filter(x=>x.cat==='Setting term');
  if(terms.length) sit+=`<div class="lead">Setting terms</div><div class="chips">${terms.map(chipBtn).join('')}</div>`;
  if(sit) out.push(sec('Situation',sit));

  for(const c of m.custom) out.push(sec(esc(c.title),blocksHtml(c.blocks,hl)));

  const concern=m.factions.filter(f=>['HOSTILE','WARY','UNCERTAIN'].includes(f.status)).sort((a,b)=>b.threat-a.threat);
  if(m.threat.length||m.hazards.length||concern.length){
    let b=blocksHtml(m.threat,hl);
    if(concern.length) b+=`<div class="lead">Factions of concern</div><div class="chips">${concern.map(f=>`<button type="button" class="f bad" data-t="f" data-id="${f.id}">${esc(f.name)} <span class="tag ${f.status.toLowerCase()}">${f.status}</span></button>`).join('')}</div>`;
    if(m.hazards.length) b+=`<div class="lead">Hazards noted</div><div class="chips">${m.hazards.map(h=>`<span class="tag restriction">${esc(h)}</span>`).join('')}</div>`;
    out.push(sec('Threat assessment',b));
  }

  if(m.objectives.length){
    let b='';
    if(prim.length){
      const stm='Team will '+prim.slice(0,3).map(o=>lcfirst(o.text)).join('; then ')+'.'+(prim.length>3?` ${prim.length-3} further primary task${prim.length-3>1?'s':''} follow.`:'');
      b+=`<div class="statement"><b>Mission statement</b>${hl(stm)}</div>`;
    }
    const li=(o,i,k)=>`<li><span class="k">${k}${i+1}.</span><span>${hl(o.text)}</span><span class="tag ${o.pri.toLowerCase()}">${o.pri}</span></li>`;
    b+=`<ul class="ol">${prim.map((o,i)=>li(o,i,'P')).join('')}${sec2.map((o,i)=>li(o,i,'S')).join('')}${rest.map((o,i)=>li(o,i,'R')).join('')}</ul>`;
    out.push(sec('Mission and tasks',b));
  }
  if(m.logistics.length) out.push(sec('Support and logistics',blocksHtml(m.logistics,hl)));
  out.push(sec('Command and signal',blocksHtml(m.command,hl)+`<p>Report mission status to ${esc(meta.from)} on completion. Acknowledge receipt.</p>`));

  const cls=meta.classif,T=THEMES[document.documentElement.dataset.style]||THEMES.holo;
  const profile=m.profile.length?`<dt>Profile</dt><dd>${esc(m.profile.join(' / '))}</dd>`:'';
  const area=meta.area?`<dt>Area</dt><dd>${esc(meta.area)}</dd>`:'';
  return `<article class="doc${$('#optRedact').checked?' redact':''}">
    <div class="banner">${esc(cls)}<small>${esc(CLASS_NOTE[cls]||'')}</small></div>
    <header class="memo">${sealHtml()}<div><div class="auth">${esc(meta.from)}</div><h1>Mission briefing<br>${esc(meta.op)}</h1></div>
      <dl class="fields"><dt>To</dt><dd>${esc(meta.to)}</dd><dt>From</dt><dd>${esc(meta.from)}</dd><dt>DTG</dt><dd>${esc(meta.dtg)} / ${esc(meta.sd)}</dd><dt>Control no.</dt><dd>${esc(meta.ctl)}</dd>${area}${profile}<dt>Subject</dt><dd>${esc(meta.subject)}</dd></dl>
    </header>
    ${out.join('')}
    <div class="sig"><span>END OF BRIEFING</span><span>${esc(meta.ctl)} // ${esc(cls)}</span><span>${esc(T.strap)}</span></div>
    <div class="banner">${esc(cls)}</div>
  </article>`;
}

function pips(n){return `<span class="pips" aria-label="Threat ${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}
function dossier(e,hl){
  if(!e.desc) return '';
  const ss=splitSentences(e.desc),head=ss.slice(0,2).join(' '),tail=ss.slice(2).join(' ');
  return `<p class="dos">${hl(head)}</p>${tail?`<details class="more"><summary>Full dossier</summary><p class="dos">${hl(tail)}</p></details>`:''}`;
}
function mentionList(e,hl,max){
  if(!e.occ.length) return '';
  const title=e.desc?'Elsewhere in the briefing':'In the briefing';
  return `<div><div class="lead" style="margin-top:0">${title}</div><ul>${e.occ.slice(0,max||3).map(s=>`<li>${hl(s)}</li>`).join('')}</ul>${e.occ.length>(max||3)?`<p class="hint" style="margin-top:4px">${e.occ.length-(max||3)} more mention${e.occ.length-(max||3)>1?'s':''}</p>`:''}</div>`;
}
const mentionMeta=e=>e.mentions?`${e.mentions} mention${e.mentions===1?'':'s'}`:(e.desc?'Dossier entry':'0 mentions');

function renderPersons(){
  const m=state.model,hl=buildHl(m);
  if(!m.persons.length) return `<div class="empty"><b>No persons found</b><p>Names are detected after a title such as Captain, Staff Sergeant, Dr. or Ambassador. You can also list them under a PERSONS heading as <i>Name -- description</i>, or add them under Track extra names.</p></div>`;
  return `<p class="intro">${m.persons.length} person${m.persons.length>1?'s':''} of interest. Status and threat are estimated from the surrounding text and should be checked by the game master.</p>${allBar()}
  <div class="cards">${m.persons.map(p=>{
    const sub=[p.title,p.affil].filter(Boolean).join(' · ')||(p.role?'':'No rank or title');
    const body=dossier(p,hl)+mentionList(p,hl,2);
    return `<article class="${cardCls(p)}" id="c-${p.id}">
      <header><div><h4>${esc(p.bare)}</h4><div class="sub">${esc(sub)}${p.role?`${sub?' · ':''}${esc(p.role)}`:''}</div></div><span class="hr"><span class="tag ${p.status.toLowerCase()}">${p.status}</span>${tgBtn(p)}${rmBtn(p)}</span></header><div class="cbody">
      <div class="meta">${p.status==='ALLIED'?'<span>Friendly</span>':`<span>Threat ${pips(p.threat)}</span>`}<span>${mentionMeta(p)}</span></div>
      ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag kind">${esc(t)}</span>`).join('')}</div>`:''}
      ${body||'<p class="none">No further detail in the source text.</p>'}
      ${linkBlock('Affiliations',linked(m,p,'f',5))}
      ${linkBlock('Linked locations',linked(m,p,'l',5))}
    </div></article>`}).join('')}</div>`;
}

function renderFactions(){
  const m=state.model,hl=buildHl(m);
  if(!m.factions.length) return `<div class="empty"><b>No factions found</b><p>Groups are detected from words like Syndicate, Alliance, Sovereignty, Committee or Fleet (for example “the Vantari Syndicate”), plus Lancer powers such as Union, the manufacturers and the Committees. You can also list them under a FACTIONS heading as <i>Name -- description</i>, or add them under Track extra names.</p></div>`;
  return `<p class="intro">${m.factions.length} faction${m.factions.length>1?'s':''} identified. Stance and threat are estimated from the surrounding text and should be checked by the game master.</p>${allBar()}
  <div class="cards">${m.factions.map(f=>{
    const body=(f.note?`<p class="def">${esc(f.note)}</p>`:'')+dossier(f,hl)+mentionList(f,hl,2);
    return `<article class="${cardCls(f)}" id="c-${f.id}">
      <header><div><h4>${esc(f.name)}</h4><div class="sub">${esc(f.type)}</div></div><span class="hr"><span class="tag ${f.status.toLowerCase()}">${f.status}</span>${tgBtn(f)}${rmBtn(f)}</span></header><div class="cbody">
      <div class="meta">${f.threat?`<span>Threat ${pips(f.threat)}</span>`:''}<span>${mentionMeta(f)}</span></div>
      ${body||'<p class="none">No further detail in the source text.</p>'}
      ${linkBlock('Persons linked',linked(m,f,'p',6))}
      ${linkBlock('Active at',linked(m,f,'l',5))}
    </div></article>`}).join('')}</div>`;
}

const isShip=l=>SHIP_TYPES.includes(l.type);
function globe(locs){
  const cx=150,cy=150,R=66,rad=Math.PI/180,p0=20*rad;
  const proj=(lat,lon)=>{
    const f=lat*rad,l=lon*rad;
    return {x:cx+R*Math.cos(f)*Math.sin(l),
            y:cy-R*(Math.cos(p0)*Math.sin(f)-Math.sin(p0)*Math.cos(f)*Math.cos(l)),
            vis:Math.sin(p0)*Math.sin(f)+Math.cos(p0)*Math.cos(f)*Math.cos(l)};
  };
  const seg=pts=>{let d='',pen=false;for(const q of pts){if(q.vis>0){d+=(pen?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1);pen=true}else pen=false}return d};
  let grat='';
  for(const lat of [-60,-30,0,30,60]){const pts=[];for(let lon=-180;lon<=180;lon+=6)pts.push(proj(lat,lon));grat+=seg(pts)}
  for(let lon=-150;lon<=180;lon+=30){const pts=[];for(let lat=-90;lat<=90;lat+=6)pts.push(proj(lat,lon));grat+=seg(pts)}
  const body=locs.find(l=>PLANET_TYPES.includes(l.type));
  const ships=locs.filter(isShip),surface=locs.filter(l=>!isShip(l)&&l!==body&&!l.region);
  const trunc=n=>n.length>16?n.slice(0,15)+'…':n;
  const labels=[];
  let s=`<svg viewBox="0 0 300 300" class="radar" role="img" aria-label="Schematic globe with surface sites and ships in orbit"><defs><radialGradient id="gl" cx=".35" cy=".3" r=".85"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--bg);stop-opacity:1"/></radialGradient></defs>`;
  s+=`<circle class="orbit" cx="${cx}" cy="${cy}" r="90"/><circle class="orbit" cx="${cx}" cy="${cy}" r="108"/>`;
  s+=`<circle class="halo" cx="${cx}" cy="${cy}" r="${R+3}"/>`;
  s+=`<circle class="planet" cx="${cx}" cy="${cy}" r="${R}" fill="url(#gl)"${body?` data-t="l" data-id="${body.id}"`:''}>${body?`<title>${esc(body.name)}</title>`:''}</circle>`;
  s+=`<path class="grat" d="${grat}"/>`;
  surface.forEach(l=>{
    const h=hash(l.name),lat=-40+((h%1000)/1000)*90,lon=-58+(((h>>>10)%1000)/1000)*116,p=proj(lat,lon);
    s+=`<circle class="blip" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" data-t="l" data-id="${l.id}"><title>${esc(l.name)}</title></circle>`;
    labels.push({x:p.x,y:p.y+14,t:trunc(l.name),dy:10});
  });
  ships.forEach((l,k)=>{
    const h=hash(l.name),a=h%360,r=k%2?108:90,x=cx+r*Math.cos(a*rad),y=cy+r*Math.sin(a*rad);
    s+=`<polygon class="ship" points="0,-6 5,5 -5,5" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a+180})" data-t="l" data-id="${l.id}"><title>${esc(l.name)} (in orbit)</title></polygon>`;
    const up=y<cy;
    labels.push({x,y:up?y-10:y+17,t:trunc(l.name.replace(VESSEL_PRE,'')),dy:up?-10:10});
  });
  const placed=[];
  for(const lb of labels){
    const w=lb.t.length*5.4;
    for(let i=0;i<6&&placed.some(p=>Math.abs(p.x-lb.x)<(p.w+w)/2+2&&Math.abs(p.y-lb.y)<10);i++) lb.y+=lb.dy;
    placed.push({x:lb.x,y:lb.y,w});
    s+=`<text x="${lb.x.toFixed(1)}" y="${lb.y.toFixed(1)}" text-anchor="middle">${esc(lb.t)}</text>`;
  }
  s+='</svg>';
  const caption=(body?`${esc(body.name)} is drawn as the globe. `:'')+`Surface sites sit on the globe and ships (▲) sit in orbit. Regions are not plotted. Positions are generated, not canonical. Select a marker to open its card.`;
  return {svg:s,caption};
}
function renderLocs(){
  const m=state.model,hl=buildHl(m),g=globe(m.locations);
  if(!m.locations.length) return `<div class="empty"><b>No locations found</b><p>Places are detected from words like Station, Sector, Moon, Colony or a ship prefix such as UES or UNS-CV. You can also list them under a LOCATIONS heading, or add them under Track extra names.</p></div>`;
  const cards=m.locations.map(l=>{
    const body=dossier(l,hl)+mentionList(l,hl,2);
    const sub=l.shipClass?`${l.type} · ${l.shipClass}`:l.type;
    return `<article class="${cardCls(l)}" id="c-${l.id}">
      <header><div><h4>${esc(l.name)}</h4><div class="sub">${esc(sub)}</div></div><span class="hr"><span class="tag">Ref ${esc(l.ref)}</span>${tgBtn(l)}${rmBtn(l)}</span></header><div class="cbody">
      <div class="meta"><span>${mentionMeta(l)}</span><span>${l.hazards.length?l.hazards.length+' hazard'+(l.hazards.length>1?'s':''):'No hazards noted'}</span></div>
      ${l.hazards.length?`<div class="chips" style="margin-top:0">${l.hazards.map(h=>`<span class="tag restriction">${esc(h)}</span>`).join('')}</div>`:''}
      ${body||'<p class="none">No further detail in the source text.</p>'}
      ${linkBlock('Persons linked',linked(m,l,'p',6))}
      ${linkBlock('Factions',linked(m,l,'f',5))}
    </div></article>`}).join('');
  return `<p class="intro">${m.locations.length} location${m.locations.length>1?'s':''} identified. Grid references and plot positions are generated for display only.</p>${allBar()}
  <div class="split"><div class="cards">${cards}</div>
  <figure class="radarbox" style="margin:0">${g.svg}<figcaption>${g.caption}</figcaption></figure></div>`;
}

function renderObjs(){
  const m=state.model,hl=buildHl(m);
  if(!m.objectives.length) return `<div class="empty"><b>No objectives found</b><p>Tasks are detected from sentences like “Your team must…”, “Your assignment is to…”, imperative orders such as “Secure the vault”, or lines under a MISSION or OBJECTIVES heading.</p></div>`;
  const tasks=m.objectives.filter(o=>o.pri!=='RESTRICTION');
  const dn=tasks.filter(o=>state.done.has(o.text)).length;
  const pct=tasks.length?Math.round(dn/tasks.length*100):0;
  const group=(title,list)=>list.length?`<div class="ogroup"><h4>${title}</h4>${list.map(o=>{
      const isTask=o.pri!=='RESTRICTION',on=isTask&&state.done.has(o.text);
      const links=[...o.facs.map(id=>byId(m,id)),...o.locs.map(id=>byId(m,id)),...o.people.map(id=>byId(m,id))].filter(Boolean);
      return `<button type="button" class="obj" role="${isTask?'checkbox':'note'}" ${isTask?`aria-checked="${on}"`:''} data-o="${esc(o.id)}"><span class="box" aria-hidden="true">${isTask?(on?'✓':''):'!'}</span><span><span class="t">${hl(o.text)}</span>${links.length?`<span class="chips">${links.map(e=>`<span>${esc(e.name)}</span>`).join('')}</span>`:''}</span></button>`}).join('')}</div>`:'';
  return `<div class="progress"><div class="meta"><span>Progress</span><span id="pcount">${dn} of ${tasks.length} complete</span></div><div class="bar"><i id="pbar" style="width:${pct}%"></i></div></div>
  ${group('Primary objectives',m.objectives.filter(o=>o.pri==='PRIMARY'))}
  ${group('Secondary objectives',m.objectives.filter(o=>o.pri==='SECONDARY'))}
  ${group('Restrictions and rules of engagement',m.objectives.filter(o=>o.pri==='RESTRICTION'))}`;
}

function renderCodex(){
  const m=state.model,hl=buildHl(m);
  if(!m.codex.length) return `<div class="empty"><b>Nothing for the codex</b><p>The codex collects setting terms (NHP, omninet, blinkgate, Diasporan and similar), named eras and events (anything ending in Period, War, Dispute, Years and so on), and ship or NHP classes such as “Ebro-class”. None were found in this text.</p></div>`;
  const groups=[['Setting term','Setting terms'],['Era or event','Eras and events'],['Class','Classes']];
  const card=x=>{
    const people=linked(m,x,'p',5),facs=linked(m,x,'f',5),locs=linked(m,x,'l',5);
    return `<article class="card" id="c-${x.id}">
      <header><div><h4>${esc(x.name)}</h4><div class="sub">${esc(x.cat)}</div></div><span class="hr"><span class="tag">${x.mentions} mention${x.mentions===1?'':'s'}</span>${rmBtn(x)}</span></header>
      ${x.def?`<p class="def">${esc(x.def)}</p>`:''}
      ${x.occ.length?`<ul>${x.occ.slice(0,3).map(s=>`<li>${hl(s)}</li>`).join('')}</ul>`:''}
      ${linkBlock('Persons',people)}${linkBlock('Factions',facs)}${linkBlock('Locations',locs)}
    </article>`;
  };
  return `<p class="intro">${m.codex.length} setting reference${m.codex.length>1?'s':''} found. Definitions are short reminders for the table; check the books for rules and detail.</p>
  ${groups.map(([cat,title])=>{const l=m.codex.filter(x=>x.cat===cat);return l.length?`<h4 class="group-h">${title}</h4><div class="cards">${l.map(card).join('')}</div>`:''}).join('')}`;
}

const RENDER={brief:renderBrief,persons:renderPersons,factions:renderFactions,locs:renderLocs,objs:renderObjs,codex:renderCodex};
function show(tab){
  state.tab=tab;
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===tab)));
  $('#stage').setAttribute('aria-labelledby','t-'+tab);
  $('#stage').innerHTML=RENDER[tab]();
}
function counts(){
  $('#n-persons').textContent=state.model.persons.length;
  $('#n-facs').textContent=state.model.factions.length;
  $('#n-locs').textContent=state.model.locations.length;
  $('#n-objs').textContent=state.model.objectives.length;
  $('#n-codex').textContent=state.model.codex.length;
  const n=state.removed.size;$('#restore').hidden=!n;$('#restore').textContent=`Restore removed (${n})`;
}
function goEntity(t,id){
  show(t==='p'?'persons':t==='f'?'factions':t==='x'?'codex':'locs');
  const c=$('#c-'+id);
  if(c){if(c.classList.contains('has-body')){c.classList.add('open');const ent=byId(state.model,id);if(ent){state.open.add(ckey(ent));persistOpen()}const tg=c.querySelector('.tg');if(tg)tg.setAttribute('aria-expanded','true')}c.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'});c.classList.add('flash')}
}

/* plain-text export */
function plainText(){
  const m=state.model,meta=state.meta;
  if(m.empty) return '';
  const L=[];const blk=b=>b.forEach(x=>L.push(x.type==='ul'?x.items.map(i=>'  - '+i).join('\n'):x.text,''));
  L.push(`*** ${meta.classif} // ${CLASS_NOTE[meta.classif]||''} ***`,'',`MISSION BRIEFING: ${meta.op}`,`TO: ${meta.to}`,`FROM: ${meta.from}`,`DTG: ${meta.dtg} / ${meta.sd}`,`CONTROL NO: ${meta.ctl}`,...(meta.area?[`AREA: ${meta.area}`]:[]),...(m.profile.length?[`PROFILE: ${m.profile.join(' / ')}`]:[]),`SUBJECT: ${meta.subject}`,'');
  let n=0;const H=t=>L.push(`${++n}. ${t}`,'');
  if(m.situation.length||m.persons.length||m.factions.length||m.locations.length){H('SITUATION');blk(m.situation);
    if(m.persons.length)L.push('Personnel of interest: '+m.persons.map(p=>p.bare+(p.title?' ('+p.title+')':'')).join('; '),'');
    if(m.factions.length)L.push('Factions: '+m.factions.map(f=>f.name+' ['+f.status+']').join('; '),'');
    if(m.locations.length)L.push('Area of operations: '+m.locations.map(l=>l.name).join('; '),'')}
  m.custom.forEach(c=>{H(c.title);blk(c.blocks)});
  if(m.threat.length||m.hazards.length){H('THREAT ASSESSMENT');blk(m.threat);if(m.hazards.length)L.push('Hazards noted: '+m.hazards.join(', '),'')}
  if(m.objectives.length){H('MISSION AND TASKS');const k={PRIMARY:'P',SECONDARY:'S',RESTRICTION:'R'},c={P:0,S:0,R:0};
    for(const pri of ['PRIMARY','SECONDARY','RESTRICTION']) m.objectives.filter(o=>o.pri===pri).forEach(o=>L.push(`  ${k[pri]}${++c[k[pri]]}. ${o.text} [${pri}]`));L.push('')}
  if(m.logistics.length){H('SUPPORT AND LOGISTICS');blk(m.logistics)}
  H('COMMAND AND SIGNAL');blk(m.command);L.push(`Report mission status to ${meta.from} on completion. Acknowledge receipt.`,'',`END OF BRIEFING // ${meta.classif}`);
  return L.join('\n');
}

/* generate */
function generate(){
  clearInterval(state.bootTimer);
  const {src,extras}=readInputs();
  const token=++state.gen;
  state.full=analyze(src,extras);applyRemovals();
  state.meta=makeMeta(state.model,src);
  counts();
  const finish=()=>{if(token!==state.gen)return;show(state.tab);$('#status').textContent=state.model.empty?'Ready':`${state.meta.ctl} generated ${state.meta.dtg}`};
  if(state.model.empty||!$('#optBoot').checked||reduced){finish();return}
  show('brief');
  const lines=(THEMES[document.documentElement.dataset.style]||THEMES.holo).boot;
  $('#stage').innerHTML='<div class="boot" id="boot"></div>';
  $('#status').textContent='Decrypting…';
  let i=0;
  state.bootTimer=setInterval(()=>{
    if(token!==state.gen){clearInterval(state.bootTimer);return}
    if(i<lines.length){const d=document.createElement('div');d.textContent=lines[i++]+' …';$('#boot')?.appendChild(d)}
    else{clearInterval(state.bootTimer);show('brief');finish()}
  },170);
}

/* ---- look options: theme defaults unless the user has set them ---- */
const OPT_BOXES=[['optScan','bt-scan','scan'],['optGlow','bt-glow','glow'],['optCut','bt-cut','cut'],['optTex','bt-tex','tex']];
function syncLook(){
  const r=document.documentElement;
  r.dataset.glow=$('#optGlow').checked?'on':'off';
  r.dataset.cut=$('#optCut').checked?'on':'off';
  r.dataset.tex=$('#optTex').checked?'on':'off';
  r.dataset.density=$('#optDensity').value;
  r.dataset.font=$('#optFont').value;
  $('#display').classList.toggle('crt',$('#optScan').checked);
}
function applyThemeDefaults(){
  const T=THEMES[document.documentElement.dataset.style]||THEMES.holo;
  for(const [id,key,prop] of OPT_BOXES){const v=store.get(key,null);$('#'+id).checked=v!==null?v==='1':!!T[prop]}
  syncLook();
}
function setStyle(s,init){
  if(!THEMES[s]) s='green';
  document.documentElement.dataset.style=s;
  $$('.chip[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===s)));
  store.set('bt-style',s);
  $('#brandSub').textContent=THEMES[s].sub;
  applyThemeDefaults();
  if(!store.get('bt-size','')){
    document.documentElement.style.removeProperty('--body-size');
    $('#optSize').value=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--body-size'))||17;
  }
  if(!init&&!state.model.empty&&state.full) show(state.tab);
}

/* events */
document.addEventListener('click',e=>{
  const rm=e.target.closest('.rm');
  if(rm){
    const ent=byId(state.model,rm.dataset.id);
    if(ent){
      state.removed.add(ent.t+':'+ent.name.toLowerCase());persist();
      applyRemovals();counts();show(state.tab);$('#stage').focus({preventScroll:true});
      $('#status').textContent=`Removed ${ent.name}`;
    }
    return;
  }
  const all=e.target.closest('[data-all]');
  if(all){
    const want=all.dataset.all==='open';
    $$('#stage .card.has-body').forEach(c=>{
      c.classList.toggle('open',want);const tg=c.querySelector('.tg');if(tg)tg.setAttribute('aria-expanded',String(want));
      const ent=byId(state.model,c.id.slice(2));if(ent)want?state.open.add(ckey(ent)):state.open.delete(ckey(ent));
    });
    persistOpen();return;
  }
  const hd=e.target.closest('.card.has-body > header');
  if(hd&&!e.target.closest('.rm')){
    const c=hd.parentElement,on=!c.classList.contains('open');
    c.classList.toggle('open',on);const tg=c.querySelector('.tg');if(tg)tg.setAttribute('aria-expanded',String(on));
    const ent=byId(state.model,c.id.slice(2));if(ent){on?state.open.add(ckey(ent)):state.open.delete(ckey(ent));persistOpen()}
    return;
  }
  const chip=e.target.closest('.chip[data-style]');
  if(chip){setStyle(chip.dataset.style);return}
  const tab=e.target.closest('.tab');
  if(tab){show(tab.dataset.tab);return}
  const red=e.target.closest('.doc.redact .ent-p:not(.revealed)');
  if(red){red.classList.add('revealed');return}
  const ent=e.target.closest('[data-t][data-id]');
  if(ent&&$('#stage').contains(ent)){goEntity(ent.dataset.t,ent.dataset.id);return}
  const ob=e.target.closest('.obj[role="checkbox"]');
  if(ob){
    const o=state.model.objectives.find(x=>x.id===ob.dataset.o);if(!o)return;
    state.done.has(o.text)?state.done.delete(o.text):state.done.add(o.text);persist();
    const on=state.done.has(o.text);ob.setAttribute('aria-checked',String(on));ob.querySelector('.box').textContent=on?'✓':'';
    const tasks=state.model.objectives.filter(x=>x.pri!=='RESTRICTION'),dn=tasks.filter(x=>state.done.has(x.text)).length;
    $('#pcount').textContent=`${dn} of ${tasks.length} complete`;$('#pbar').style.width=Math.round(dn/tasks.length*100)+'%';
  }
});
$('#tabs').addEventListener('keydown',e=>{
  const ts=$$('.tab'),i=ts.indexOf(document.activeElement);
  if(i<0||!['ArrowRight','ArrowLeft'].includes(e.key))return;
  const n=ts[(i+(e.key==='ArrowRight'?1:ts.length-1))%ts.length];n.focus();show(n.dataset.tab);
});
$('#restore').onclick=()=>{state.removed.clear();persist();applyRemovals();counts();show(state.tab);$('#status').textContent='Restored removed entries'};
$('#classif').onchange=()=>{if(!state.model.empty){state.meta.classif=$('#classif').value;if(state.tab==='brief')show('brief')}};
OPT_BOXES.forEach(([id,key])=>{$('#'+id).onchange=()=>{store.set(key,$('#'+id).checked?'1':'0');syncLook()}});
$('#optBoot').onchange=()=>store.set('bt-boot',$('#optBoot').checked?'1':'0');
$('#optRedact').onchange=()=>{store.set('bt-redact',$('#optRedact').checked?'1':'0');if(state.tab==='brief')show('brief')};
$('#optSize').oninput=e=>{document.documentElement.style.setProperty('--body-size',e.target.value+'px');store.set('bt-size',e.target.value)};
$('#optFont').onchange=()=>{store.set('bt-font',$('#optFont').value);syncLook()};
$('#optDensity').onchange=()=>{store.set('bt-density',$('#optDensity').value);syncLook()};
$('#resetLook').onclick=()=>{
  ['bt-scan','bt-glow','bt-cut','bt-tex','bt-font','bt-density','bt-size'].forEach(k=>store.del(k));
  $('#optFont').value='theme';$('#optDensity').value='comfortable';
  document.documentElement.style.removeProperty('--body-size');
  applyThemeDefaults();
  $('#optSize').value=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--body-size'))||17;
  $('#status').textContent='Look reset to house defaults';
};
$('#print').onclick=()=>{try{window.print()}catch(e){$('#status').textContent='Printing is not available here'}};
$('#copy').onclick=async()=>{
  const t=plainText();if(!t){$('#status').textContent='Nothing to copy';return}
  try{await navigator.clipboard.writeText(t);$('#status').textContent='Copied to clipboard'}
  catch(err){
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();
    $('#status').textContent=ok?'Copied to clipboard':'Copy blocked here. Select the briefing text and copy it manually.';
  }
};

function setSource(hide,keep){
  $('#console').hidden=hide;
  $('.app').classList.toggle('solo',hide);
  $('#showSrc').hidden=!hide;
  $('#toggleSrc').setAttribute('aria-expanded',String(!hide));
  if(!keep) store.set('bt-hide',hide?'1':'0');
}
$('#toggleSrc').onclick=()=>setSource(true);
$('#showSrc').onclick=()=>setSource(false);

/* source file */
const REFRESH_MS=90000, MIN_GAP_MS=30000;
let lastText=null,lastCheck=0,busy=false;
const clock=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
async function loadBriefing(quiet,manual){
  if(busy) return;
  busy=true;
  let text='',err='';
  try{
    const r=await fetch('briefing.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    text=await r.text();
    if(!text.trim()) throw new Error('the file is empty');
  }catch(e){err=e.message||'not found'}
  busy=false;lastCheck=Date.now();
  const st=m=>$('#status').textContent=m;
  if(!text){
    if(lastText!==null){st(`Could not refresh (${err}). Showing the last briefing received. Retrying automatically.`);return}
    state.model=analyze('',{});state.full=state.model;counts();
    $('#stage').innerHTML='<div class="empty"><b>No briefing available</b><p>'+(location.protocol==='file:'
      ?'This page must be opened from its web address, not from a file on your computer.'
      :'The briefing file could not be loaded ('+esc(err)+'). The page will keep trying.')+'</p></div>';
    st('Waiting for briefing…');return;
  }
  if(text===lastText){st(manual?`Checked ${clock()}. No changes.`:`Up to date. Last checked ${clock()}`);return}
  const first=lastText===null;
  lastText=text;
  ingest(text);
  const boot=$('#optBoot').checked;
  if(quiet||!first) $('#optBoot').checked=false;
  generate();
  $('#optBoot').checked=boot;
  st(first?`Briefing loaded ${clock()}`:`Briefing updated ${clock()}`);
}
setInterval(()=>{if(!document.hidden) loadBriefing(true)},REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>MIN_GAP_MS) loadBriefing(true)});
$('#reload').onclick=()=>loadBriefing(false,true);
/* boot */
(function init(){
  const size=store.get('bt-size','');
  if(size){$('#optSize').value=size;document.documentElement.style.setProperty('--body-size',size+'px')}
  const f=store.get('bt-font','theme'),d=store.get('bt-density','comfortable');
  if([...$('#optFont').options].some(o=>o.value===f)) $('#optFont').value=f;
  if([...$('#optDensity').options].some(o=>o.value===d)) $('#optDensity').value=d;
  setStyle(store.get('bt-style','green'),true);
  [['#optBoot','bt-boot'],['#optRedact','bt-redact']].forEach(([s,k])=>{const v=store.get(k,null);if(v!==null)$(s).checked=v==='1'});
  setSource(store.get('bt-hide','0')==='1',true);
  try{state.removed=new Set(JSON.parse(store.get('bt-removed','[]')));state.done=new Set(JSON.parse(store.get('bt-done','[]')));state.open=new Set(JSON.parse(store.get('bt-open','[]')))}catch(e){}
  $('#stage').innerHTML='<div class="empty"><b>Loading</b><p>Reading briefing.txt…</p></div>';
  loadBriefing(true);
})();
</script>
